<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Gradient matching your CSS theme -->
    <linearGradient id="hissaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="18" fill="url(#hissaGrad)" filter="url(#glow)" />

  <!-- Inner Wallet & Shared Coin Identity -->
  <g transform="translate(14, 14)" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wallet Main Shell -->
    <path d="M4 8a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Z" fill="rgba(255, 255, 255, 0.08)" />
    
    <!-- Top Flap Edge -->
    <path d="M4 12h28" />

    <!-- Wallet Clasp / Shared Coin Accent -->
    <path d="M22 17h6a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Z" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="25" cy="21" r="1.5" fill="#ffffff" stroke="none" />
  </g>
</svg>
